<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#020617" />
  <title>Vzpomínky — Stories (Eurosky, Bluesky & Grain)</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #020617;
      --surface: #0f172a;
      --shell-bg: #090d16;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --border: rgba(255, 255, 255, 0.16);
      --chrome-grad: linear-gradient(to bottom, rgba(2, 6, 23, 0.88) 0%, rgba(2, 6, 23, 0.45) 65%, transparent 100%);
      --btn-bg: rgba(15, 23, 42, 0.72);
      --btn-hover: rgba(30, 41, 59, 0.92);
      --drawer-bg: rgba(15, 23, 42, 0.96);
      --input-bg: #020617;
      --stage-bg: radial-gradient(circle at top right, #1e293b 0%, #090d16 60%, #020617 100%);
      --eurosky-bg: radial-gradient(circle at top right, #0e7490 0%, #090d16 62%, #020617 100%);
      --text-card-bg: radial-gradient(circle at top right, #1e3a8a 0%, #0f172a 55%, #020617 100%);
      --eurosky-text-bg: radial-gradient(circle at top right, #0e7490 0%, #0f172a 55%, #020617 100%);
      --img-box-bg: rgba(2, 6, 23, 0.55);
      --progress-track: rgba(255, 255, 255, 0.28);
      --progress-fill: #ffffff;
    }

    body.light-theme {
      --bg: #e2e8f0;
      --surface: #f8fafc;
      --shell-bg: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0284c7;
      --border: rgba(15, 23, 42, 0.14);
      --chrome-grad: linear-gradient(to bottom, rgba(248, 250, 252, 0.94) 0%, rgba(248, 250, 252, 0.65) 65%, transparent 100%);
      --btn-bg: rgba(255, 255, 255, 0.85);
      --btn-hover: rgba(241, 245, 249, 0.98);
      --drawer-bg: rgba(255, 255, 255, 0.98);
      --input-bg: #f1f5f9;
      --stage-bg: radial-gradient(circle at top right, #bae6fd 0%, #f1f5f9 62%, #e2e8f0 100%);
      --eurosky-bg: radial-gradient(circle at top right, #a5f3fc 0%, #f0f9ff 62%, #e0f2fe 100%);
      --text-card-bg: radial-gradient(circle at top right, #bfdbfe 0%, #f8fafc 58%, #e2e8f0 100%);
      --eurosky-text-bg: radial-gradient(circle at top right, #99f6e4 0%, #f8fafc 58%, #e2e8f0 100%);
      --img-box-bg: rgba(255, 255, 255, 0.72);
      --progress-track: rgba(15, 23, 42, 0.16);
      --progress-fill: #0f172a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .app-shell {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--shell-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    @media (min-width: 520px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--bg);
      }
      .app-shell {
        height: min(860px, 94vh);
        border-radius: 24px;
        border: 1px solid var(--border);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
      }
    }

    .story-chrome {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      padding: 12px 12px 24px;
      background: var(--chrome-grad);
      pointer-events: none;
    }
    .progress-row {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }
    .progress-track {
      flex: 1;
      height: 3px;
      background: var(--progress-track);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--progress-fill);
      border-radius: 999px;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      pointer-events: auto;
    }
    .meta-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .year-pill {
      background: var(--accent);
      color: #020617;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .source-time {
      font-size: 0.82rem;
      color: var(--text);
      
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
        .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }
    .theme-btn {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      padding: 0;
    }
    .theme-btn:hover { background: var(--btn-hover); }
    .account-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    .account-btn:hover { background: var(--btn-hover); }

    .settings-drawer {
      position: absolute;
      top: 56px;
      left: 12px;
      right: 12px;
      z-index: 40;
      background: var(--drawer-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.7);
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .settings-drawer.open { display: flex; }
    .settings-title {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    .input-row input {
      flex: 1;
      min-width: 0;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.92rem;
      user-select: text;
    }
    .btn-primary {
      padding: 9px 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #020617;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-secondary {
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      cursor: pointer;
      align-self: flex-start;
    }
    .drawer-status {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0;
      word-break: break-word;
    }

    .story-stage {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--stage-bg);
    }

    /* Karta s obrázkem nad textem: celý obrázek bez ořezu a roztažení */
    .story-media-card {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      padding: 74px 18px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }
    .story-media-card.eurosky {
      background: var(--eurosky-bg);
    }
    .story-image-box {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 14px;
      background: var(--img-box-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .story-image-fit {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 10px;
    }
    .story-caption-stack {
      flex-shrink: 0;
      max-height: 36%;
      overflow-y: auto;
      padding-right: 4px;
    }
    .story-caption-text {
      font-size: 1.04rem;
      line-height: 1.45;
      color: #f8fafc;
      white-space: pre-wrap;
      margin: 0;
    }
    .story-date-footer {
      display: block;
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* Typografická karta pro čistě textové posty */
    .story-text-card {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      padding: 84px 24px 42px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--text-card-bg);
    }
    .story-text-card.eurosky {
      background: var(--eurosky-text-bg);
    }
    .quote-mark {
      font-size: 3rem;
      line-height: 1;
      color: var(--accent);
      opacity: 0.6;
      margin-bottom: 8px;
      font-family: Georgia, serif;
    }
    .story-main-text {
      font-size: 1.28rem;
      line-height: 1.5;
      font-weight: 500;
      color: #f8fafc;
      white-space: pre-wrap;
      margin: 0 0 18px 0;
    }

    .tap-zones {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
    }
    .tap-prev { width: 32%; height: 100%; cursor: pointer; }
    .tap-next { width: 68%; height: 100%; cursor: pointer; }

    .center-message {
      position: relative;
      z-index: 25;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      max-width: 340px;
    }
    .center-message h2 {
      color: var(--text);
      font-size: 1.15rem;
      margin: 0 0 8px;
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
    <div class="story-chrome">
      <div class="progress-row" id="progressRow"></div>
      <div class="header-row">
        <div class="meta-info">
          <span class="year-pill" id="yearBadge">Dnes v historii</span>
          <span class="source-time" id="metaLabel"></span>
        </div>
        <div class="header-actions">
          <button class="theme-btn" id="themeBtn" type="button" title="Přepnout světlý / tmavý motiv" aria-label="Přepnout světlý / tmavý motiv"></button>
          <button class="account-btn" id="toggleDrawerBtn" type="button">Účet</button>
        </div>
      </div>
    </div>

    <div class="settings-drawer" id="settingsDrawer">
      <p class="settings-title">Zadej handle nebo DID (Eurosky / Bluesky / Grain):</p>
      <div class="input-row">
        <input type="text" id="handleInput" placeholder="např. jmeno.eurosky.social" />
        <button class="btn-primary" id="loadBtn" type="button">Načíst</button>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <button class="btn-secondary" id="demoBtn" type="button">Ukázková data</button>
        <p class="drawer-status" id="drawerStatus"></p>
      </div>
    </div>

    <div class="story-stage" id="storyStage"></div>

    <div class="tap-zones" id="tapZones">
      <div class="tap-prev" id="tapPrev" title="Předchozí"></div>
      <div class="tap-next" id="tapNext" title="Další"></div>
    </div>
  </div>

  <script>
    const STORY_DURATION_MS = 6000;
    const now = new Date();
    const targetMonth = now.getMonth();
    const targetDay = now.getDate();
    const currentYear = now.getFullYear();

    const progressRow = document.getElementById("progressRow");
    const yearBadge = document.getElementById("yearBadge");
    const metaLabel = document.getElementById("metaLabel");
    const storyStage = document.getElementById("storyStage");
    const settingsDrawer = document.getElementById("settingsDrawer");
    const toggleDrawerBtn = document.getElementById("toggleDrawerBtn");
    const handleInput = document.getElementById("handleInput");
    const loadBtn = document.getElementById("loadBtn");
    const demoBtn = document.getElementById("demoBtn");
    const drawerStatus = document.getElementById("drawerStatus");
    const tapZones = document.getElementById("tapZones");
    const tapPrev = document.getElementById("tapPrev");
    const tapNext = document.getElementById("tapNext");

    let stories = [];
    let currentIndex = 0;
    let isPaused = false;
    let elapsedMs = 0;
    let lastTick = 0;
    let rafId = null;

    function createDemoSvg(bg1, bg2, label) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="${bg1}"/>
            <stop offset="100%" stop-color="${bg2}"/>
          </linearGradient>
        </defs>
        <rect width="900" height="600" fill="url(#g)"/>
        <circle cx="450" cy="300" r="140" fill="rgba(255,255,255,0.08)"/>
        <text x="450" y="312" font-family="sans-serif" font-size="32" fill="rgba(255,255,255,0.8)" text-anchor="middle">${label}</text>
      </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    function getDemoStories() {
      const d1 = new Date(currentYear - 1, targetMonth, targetDay, 17, 42);
      const d2 = new Date(currentYear - 2, targetMonth, targetDay, 9, 15);
      const d3 = new Date(currentYear - 3, targetMonth, targetDay, 20, 8);
      return [
        {
          source: "Grain",
          date: d1,
          text: "Fotka nad textem se zobrazí celá bez ořezu a roztažení.",
          imageUrl: createDemoSvg("#0f766e", "#020617", "Grain • Celý obrázek")
        },
        {
          source: "Eurosky",
          date: d2,
          text: "Samostatný post na Eurosky. Odpovědi (replies) se odteď vynechávají.",
          imageUrl: null
        },
        {
          source: "Bluesky",
          date: d3,
          text: "Další vlastní post s obrázkem hezky v rámu nad popiskem.",
          imageUrl: createDemoSvg("#1d4ed8", "#090d16", "Post • Příloha")
        }
      ];
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderProgressBars() {
      progressRow.innerHTML = stories.map((_, idx) => `
        <div class="progress-track">
          <div class="progress-fill" id="pfill-${idx}" style="width: ${idx < currentIndex ? "100%" : "0%"}"></div>
        </div>
      `).join("");
    }

    let isWaitingForImage = false;
    const preloadedUrls = new Set();

    function preloadImage(url) {
      if (!url || preloadedUrls.has(url)) return;
      preloadedUrls.add(url);
      const img = new Image();
      img.decoding = "async";
      img.src = url;
    }

    function prefetchAround(index) {
      if (!stories.length) return;
      const nextIdx = (index + 1) % stories.length;
      const next2Idx = (index + 2) % stories.length;
      if (stories[nextIdx] && stories[nextIdx].imageUrl) preloadImage(stories[nextIdx].imageUrl);
      if (stories[next2Idx] && stories[next2Idx].imageUrl) preloadImage(stories[next2Idx].imageUrl);
    }

    function renderCurrentStory() {
      if (!stories.length) {
        isWaitingForImage = false;
        progressRow.innerHTML = "";
        yearBadge.textContent = `${targetDay}. ${targetMonth + 1}.`;
        metaLabel.textContent = "Žádné záznamy";
        storyStage.innerHTML = `
          <div class="center-message">
            <h2>Pro dnešek tu nic není</h2>
            <p>V minulých letech se pro datum ${targetDay}. ${targetMonth + 1}. nenašly žádné vlastní posty ani fotky na Grainu.</p>
          </div>
        `;
        return;
      }

      const item = stories[currentIndex];
      const diff = currentYear - item.date.getFullYear();
      yearBadge.textContent = diff === 1 ? "Před 1 rokem" : `Před ${diff} lety (${item.date.getFullYear()})`;
      const timeStr = item.date.toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" });
      const dateStr = item.date.toLocaleDateString("cs-CZ", { day: "numeric", month: "long", year: "numeric" });
      metaLabel.textContent = `${item.source} • ${timeStr}`;

      renderProgressBars();
      prefetchAround(currentIndex);

      const euroClass = item.source === "Eurosky" ? " eurosky" : "";

      if (item.imageUrl) {
        isWaitingForImage = true;
        elapsedMs = 0;
        storyStage.innerHTML = `
          <div class="story-media-card${euroClass}">
            <div class="story-image-box">
              <img id="activeStoryImg" class="story-image-fit" src="${item.imageUrl}" alt="" decoding="async" />
            </div>
            <div class="story-caption-stack">
              ${item.text ? `<p class="story-caption-text">${escapeHtml(item.text)}</p>` : ""}
              <span class="story-date-footer">${dateStr} • ${item.source}</span>
            </div>
          </div>
        `;

        const imgEl = document.getElementById("activeStoryImg");
        const startTimerOnce = () => {
          if (!isWaitingForImage) return;
          isWaitingForImage = false;
          elapsedMs = 0;
          lastTick = performance.now();
        };

        if (imgEl.complete && imgEl.naturalWidth > 0) {
          startTimerOnce();
        } else {
          imgEl.addEventListener("load", startTimerOnce, { once: true });
          imgEl.addEventListener("error", () => {
            if (item.fallbackUrl && imgEl.src !== item.fallbackUrl) {
              imgEl.src = item.fallbackUrl;
              imgEl.addEventListener("load", startTimerOnce, { once: true });
              imgEl.addEventListener("error", startTimerOnce, { once: true });
            } else {
              startTimerOnce();
            }
          }, { once: true });
          // Pojistka, kdyby server neodpovídal vůbec
          setTimeout(startTimerOnce, 5000);
        }
      } else {
        isWaitingForImage = false;
        storyStage.innerHTML = `
          <div class="story-text-card${euroClass}">
            <div class="quote-mark">“</div>
            <p class="story-main-text">${escapeHtml(item.text)}</p>
            <span class="story-date-footer">${dateStr} • ${item.source}</span>
          </div>
        `;
        elapsedMs = 0;
        lastTick = performance.now();
      }
    }

    function tick(nowTs) {
      if (stories.length > 0 && !isPaused && !isWaitingForImage && !settingsDrawer.classList.contains("open")) {
        const dt = nowTs - lastTick;
        elapsedMs += dt;
        const pct = Math.min(100, (elapsedMs / STORY_DURATION_MS) * 100);
        const fill = document.getElementById(`pfill-${currentIndex}`);
        if (fill) fill.style.width = `${pct}%`;

        if (elapsedMs >= STORY_DURATION_MS) {
          nextStory();
        }
      }
      lastTick = nowTs;
      rafId = requestAnimationFrame(tick);
    }

    function nextStory() {
      if (!stories.length) return;
      currentIndex = (currentIndex + 1) % stories.length;
      renderCurrentStory();
    }

    function prevStory() {
      if (!stories.length) return;
      if (elapsedMs > 1200) {
        elapsedMs = 0;
        lastTick = performance.now();
        return;
      }
      currentIndex = (currentIndex - 1 + stories.length) % stories.length;
      renderCurrentStory();
    }

    async function resolveHandle(handle) {
      const clean = handle.trim().replace(/^@/, "");
      if (clean.startsWith("did:")) return clean;

      const endpoints = [
        `https://public.api.bsky.app/xrpc/com.atproto.identity.resolveHandle?handle=${encodeURIComponent(clean)}`
      ];

      if (clean.endsWith(".eurosky.social") || clean.includes("eurosky")) {
        endpoints.unshift(`https://eurosky.social/xrpc/com.atproto.identity.resolveHandle?handle=${encodeURIComponent(clean)}`);
      }

      for (const ep of endpoints) {
        try {
          const res = await fetch(ep);
          if (res.ok) {
            const data = await res.json();
            if (data && data.did) return data.did;
          }
        } catch (_) {}
      }

      try {
        const dnsRes = await fetch(`https://dns.google/resolve?name=${encodeURIComponent("_atproto." + clean)}&type=TXT`);
        if (dnsRes.ok) {
          const dnsData = await dnsRes.json();
          const txt = (dnsData.Answer || []).map(a => String(a.data || "").replace(/"/g, "")).join(" ");
          const match = txt.match(/did=(did:[a-z0-9]+:[^\s;]+)/i);
          if (match) return match[1];
        }
      } catch (_) {}

      throw new Error("Účet se nepodařilo dohledat (zkontroluj handle nebo DID).");
    }

    async function resolvePds(did, handleHint = "") {
      const fallback = handleHint.toLowerCase().includes("eurosky")
        ? "https://eurosky.social"
        : "https://bsky.social";
      try {
        const url = did.startsWith("did:plc:")
          ? `https://plc.directory/${did}`
          : `https://${did.replace("did:web:", "")}/.well-known/did.json`;
        const res = await fetch(url);
        if (!res.ok) return fallback;
        const doc = await res.json();
        const service = (doc.service || []).find(s => s.id === "#atproto_pds" || s.type === "AtprotoPersonalDataServer");
        return service && service.serviceEndpoint ? service.serviceEndpoint.replace(/\/$/, "") : fallback;
      } catch (_) {
        return fallback;
      }
    }

    function detectPostSource(pdsEndpoint, handleOrInput) {
      const combined = `${pdsEndpoint || ""} ${handleOrInput || ""}`.toLowerCase();
      if (combined.includes("eurosky")) return "Eurosky";
      return "Bluesky";
    }

    async function fetchAllRecords(pds, repo, collection, maxPages = 150) {
      let records = [];
      let cursor = null;
      for (let i = 0; i < maxPages; i++) {
        const params = new URLSearchParams({ repo, collection, limit: "100" });
        if (cursor) params.set("cursor", cursor);
        const res = await fetch(`${pds}/xrpc/com.atproto.repo.listRecords?${params}`);
        if (!res.ok) {
          if (i === 0) throw new Error(`PDS ${pds} vrátil HTTP ${res.status} pro ${collection}`);
          break;
        }
        const data = await res.json();
        if (!data.records || data.records.length === 0) break;
        records = records.concat(data.records);
        cursor = data.cursor;
        if (!cursor) break;
      }
      return records;
    }

    function isSameDayPastYear(isoString) {
      if (!isoString) return false;
      const d = new Date(isoString);
      if (Number.isNaN(d.getTime())) return false;

      const localMatch =
        d.getMonth() === targetMonth &&
        d.getDate() === targetDay &&
        d.getFullYear() < currentYear;

      const utcMatch =
        d.getUTCMonth() === targetMonth &&
        d.getUTCDate() === targetDay &&
        d.getUTCFullYear() < currentYear;

      return localMatch || utcMatch;
    }

    function isOwnTopLevelPost(postValue) {
      if (!postValue || typeof postValue !== "object") return false;
      // Vynecháme replies (odpovědi na jiný post)
      if (postValue.reply) return false;
      return true;
    }

    function extractBlobUrl(pds, did, blobObj) {
      if (!blobObj || !blobObj.ref || !blobObj.ref.$link) return null;
      const cid = blobObj.ref.$link;
      return `https://cdn.bsky.app/img/feed_fullsize/plain/${encodeURIComponent(did)}/${encodeURIComponent(cid)}@jpeg`;
    }

    function extractFallbackBlobUrl(pds, did, blobObj) {
      if (!blobObj || !blobObj.ref || !blobObj.ref.$link) return null;
      const cid = blobObj.ref.$link;
      return `${pds}/xrpc/com.atproto.sync.getBlob?did=${encodeURIComponent(did)}&cid=${encodeURIComponent(cid)}`;
    }

    async function loadRealData(handle) {
      const clean = handle.trim();
      if (!clean) {
        drawerStatus.textContent = "Zadej handle nebo DID.";
        return;
      }
      localStorage.setItem("atproto_timehop_handle", clean);
      loadBtn.disabled = true;
      drawerStatus.textContent = "Hledám DID a PDS repozitář...";

      try {
        const did = await resolveHandle(clean);
        let pds = await resolvePds(did, clean);

        let bskyPosts = [];
        try {
          bskyPosts = await fetchAllRecords(pds, did, "app.bsky.feed.post");
        } catch (primaryErr) {
          if (pds !== "https://eurosky.social") {
            pds = "https://eurosky.social";
            bskyPosts = await fetchAllRecords(pds, did, "app.bsky.feed.post");
          } else {
            throw primaryErr;
          }
        }

        let grainPhotos = [];
        try {
          grainPhotos = await fetchAllRecords(pds, did, "social.grain.photo");
        } catch (_) {}

        const postSource = detectPostSource(pds, clean);

        const loaded = [];
        let ownPostsCount = 0;

        for (const rec of bskyPosts) {
          const val = rec.value || {};
          if (!isOwnTopLevelPost(val)) continue;
          ownPostsCount++;

          if (isSameDayPastYear(val.createdAt)) {
            let firstImage = null;
            if (val.embed && Array.isArray(val.embed.images) && val.embed.images.length > 0) {
              firstImage = extractBlobUrl(pds, did, val.embed.images[0].image);
            }
            const fallbackImg = (val.embed && Array.isArray(val.embed.images) && val.embed.images.length > 0)
              ? extractFallbackBlobUrl(pds, did, val.embed.images[0].image)
              : null;
            loaded.push({
              source: postSource,
              date: new Date(val.createdAt),
              text: val.text || "",
              imageUrl: firstImage,
              fallbackUrl: fallbackImg
            });
          }
        }

        for (const rec of grainPhotos) {
          const val = rec.value || {};
          const dateStr = val.createdAt || val.takenAt;
          if (isSameDayPastYear(dateStr)) {
            const rawBlob = val.photo || val.image;
            const url = extractBlobUrl(pds, did, rawBlob);
            const fallbackUrl = extractFallbackBlobUrl(pds, did, rawBlob);
            loaded.push({
              source: "Grain",
              date: new Date(dateStr),
              text: val.alt || val.caption || "",
              imageUrl: url,
              fallbackUrl: fallbackUrl
            });
          }
        }

        loaded.sort((a, b) => b.date - a.date);
        stories = loaded;
        for (const st of stories) {
          if (st.imageUrl) preloadImage(st.imageUrl);
        }
        currentIndex = 0;
        drawerStatus.textContent = `${postSource}: ${ownPostsCount} vlastních postů (ze ${bskyPosts.length} záznamů), Grain: ${grainPhotos.length} fotek.`;
        settingsDrawer.classList.remove("open");
        renderCurrentStory();
      } catch (err) {
        drawerStatus.textContent = `Chyba: ${err.message}`;
      } finally {
        loadBtn.disabled = false;
      }
    }

    toggleDrawerBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      settingsDrawer.classList.toggle("open");
    });

    loadBtn.addEventListener("click", () => loadRealData(handleInput.value));
    handleInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadRealData(handleInput.value);
    });

    demoBtn.addEventListener("click", () => {
      stories = getDemoStories();
      currentIndex = 0;
      drawerStatus.textContent = "Načtena ukázková data.";
      settingsDrawer.classList.remove("open");
      renderCurrentStory();
    });

    let pointerDownTime = 0;
    tapZones.addEventListener("pointerdown", () => {
      isPaused = true;
      pointerDownTime = performance.now();
    });
    window.addEventListener("pointerup", () => {
      isPaused = false;
      lastTick = performance.now();
    });

    tapPrev.addEventListener("click", () => {
      if (performance.now() - pointerDownTime < 250) prevStory();
    });
    tapNext.addEventListener("click", () => {
      if (performance.now() - pointerDownTime < 250) nextStory();
    });

    window.addEventListener("keydown", (e) => {
      if (document.activeElement === handleInput) return;
      if (e.key === "ArrowRight") nextStory();
      if (e.key === "ArrowLeft") prevStory();
      if (e.key === " ") {
        e.preventDefault();
        isPaused = !isPaused;
        lastTick = performance.now();
      }
    });

    const themeBtn = document.getElementById("themeBtn");
    const THEME_KEY = "atproto_timehop_theme";

    const sunIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
    const moonIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;

    function applyTheme(mode) {
      const isLight = mode === "light";
      document.body.classList.toggle("light-theme", isLight);
      themeBtn.innerHTML = isLight ? moonIcon : sunIcon;
    }

    const savedTheme = localStorage.getItem(THEME_KEY) || "dark";
    applyTheme(savedTheme);

    themeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const next = document.body.classList.contains("light-theme") ? "dark" : "light";
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    const savedHandle = localStorage.getItem("atproto_timehop_handle");
    if (savedHandle) {
      handleInput.value = savedHandle;
      loadRealData(savedHandle);
    } else {
      stories = getDemoStories();
      drawerStatus.textContent = "Běží ukázkový režim.";
      renderCurrentStory();
    }

    lastTick = performance.now();
    rafId = requestAnimationFrame(tick);
  </script>
</body>
</html>
